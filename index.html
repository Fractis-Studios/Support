<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fractis Studios — Protected</title>
<style>body{font-family:Segoe UI,Arial,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background:#111;color:#eee;} .box{background:#222;padding:2rem;border-radius:10px;text-align:center;} input{padding:.6rem;margin:.5rem;border:none;border-radius:4px;} button{padding:.6rem 1.2rem;border:none;border-radius:4px;background:#4caf50;color:#fff;cursor:pointer;}</style>
</head>
<body>
<div class="box">
<h2>Password Required</h2>
<input type="password" id="pw" placeholder="Enter password">
<br>
<button onclick="check()">Unlock</button>
<p id="msg" style="color:#f66;"></p>
</div>
<script>
function check(){
  if(document.getElementById('pw').value==="HEEELP123@&=*"){
    sessionStorage.setItem('auth','1');
    window.location.href='Report01/';
  } else {
    document.getElementById('msg').textContent='Incorrect password';
  }
}
</script>
</body>
</html>
